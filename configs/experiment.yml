# Shared protocol. Variant switches are defined in unitextdeformer/config.py.
gpu: 0
seed: 42
lr: 0.0025
retriangulate: 0
bsdf: diffuse
clip_weight: 1.0
regularize_jacobians_weight: 0.5
batch_size: 10
train_res: 512
resize_method: cubic
consistency_clip_model: ViT-B/32
consistency_vit_stride: 16
consistency_vit_layer: 11
consistency_elev_filter: 30
consistency_azim_filter: 20
fov_min: 30.0
fov_max: 90.0
dist_min: 2.5
dist_max: 3.5
light_power: 5.0
elev_alpha: 1.0
elev_beta: 5.0
elev_max: 60.0
azim_min: 0.0
azim_max: 360.0
aug_loc: 1
aug_light: 1
aug_bkg: 1
adapt_dist: 1
steps: 2500
point_count: 10000
point_rgb: 0.4
point_checkpoint: models/uni3d/base.pt
text_checkpoint: models/uni3d/eva_clip.safetensors
text_config: models/uni3d/open_clip_config.json
model_cache: models
camera_rng_interval: 100
